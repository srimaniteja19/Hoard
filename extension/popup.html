<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOARD — Extension</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Top Header -->
    <header class="header">
      <div class="brand">
        <span class="logo-badge">HOARD</span>
        <span class="version-badge">EXTENSION</span>
      </div>
      <div class="status-indicator" id="syncStatus">● LIVE</div>
    </header>

    <!-- Tab Switcher -->
    <nav class="tab-nav">
      <button class="tab-btn active" data-tab="save">SAVE TAB</button>
      <button class="tab-btn" data-tab="hoard">MY HOARD</button>
      <button class="tab-btn" data-tab="settings">SETTINGS</button>
    </nav>

    <!-- Notification Toast -->
    <div class="toast" id="toast" style="display: none;">
      <span id="toastMsg">✓ SAVED TO HOARD</span>
    </div>

    <!-- TAB 1: SAVE TAB -->
    <main class="tab-content active" id="tab-save">
      <div class="tab-scroll">
        <div class="form-group">
          <label class="field-lbl">PAGE TITLE</label>
          <input type="text" id="pageTitle" class="input-field" placeholder="Page title..." />
        </div>

        <div class="form-group">
          <label class="field-lbl">URL LOCATION</label>
          <input type="url" id="pageUrl" class="input-field" placeholder="https://..." />
        </div>

        <!-- Detection Badge — compact inline strip -->
        <div class="detection-card" id="detectionCard">
          <div class="detection-header">
            <span class="type-tag" id="detectType">ART</span>
            <span class="detect-title" id="detectTitle">Web Article</span>
          </div>
          <div class="detect-details" id="detectDetails">Type: Web Article</div>
        </div>

        <div class="form-group">
          <label class="field-lbl">FOLDER / COLLECTION</label>
          <select id="folderSelect" class="select-field">
            <option value="unsorted">📁 [ Unsorted ]</option>
            <option value="read">📚 [ Read queue ]</option>
            <option value="listen">🎧 [ Listen shelf ]</option>
            <option value="build">🚀 [ Build shelf ]</option>
            <option value="ai">⚡ [ AI & retrieval ]</option>
            <option value="systems">⚙ [ Data & storage ]</option>
          </select>
        </div>

        <div class="form-group">
          <label class="field-lbl">TAGS</label>
          <div class="tag-picker" id="tagPicker">
            <button type="button" class="tag-chip active" data-tag="ai">#ai</button>
            <button type="button" class="tag-chip" data-tag="systems">#systems</button>
            <button type="button" class="tag-chip" data-tag="craft">#craft</button>
            <button type="button" class="tag-chip" data-tag="paper">#paper</button>
          </div>
          <input type="text" id="customTag" class="input-field-sm" placeholder="Add custom #tag and press Enter..." />
        </div>

        <div class="form-group">
          <label class="field-lbl">MY NOTE</label>
          <textarea id="pageNote" class="textarea-field" placeholder="What's worth remembering?"></textarea>
        </div>
      </div>

      <button id="saveBtn" class="btn-primary">
        <span>SAVE TO HOARD</span>
        <kbd>⌥⇧H</kbd>
      </button>
    </main>

    <!-- TAB 2: MY HOARD SEARCH -->
    <main class="tab-content" id="tab-hoard" style="display: none;">
      <div class="search-bar">
        <input type="text" id="searchInHoard" class="input-field" placeholder="Search saved bookmarks..." />
      </div>

      <div class="filter-chips">
        <button class="filter-chip active" data-filter="all">ALL</button>
        <button class="filter-chip" data-filter="unread">UNREAD</button>
        <button class="filter-chip" data-filter="VID">VIDEOS</button>
        <button class="filter-chip" data-filter="GIT">REPOS</button>
        <button class="filter-chip" data-filter="PPR">PAPERS</button>
      </div>

      <div class="hoard-list" id="hoardList">
        <!-- Bookmark items injected via popup.js -->
      </div>
    </main>

    <!-- TAB 3: SETTINGS -->
    <main class="tab-content" id="tab-settings" style="display: none;">
      <div class="settings-inner">
        <div class="form-group">
          <label class="field-lbl">HOARD APP SERVER URL</label>
          <input type="text" id="serverUrl" class="input-field" value="https://hoard-ten.vercel.app" />
        </div>

        <div class="info-box">
          <b>KEYBOARD SHORTCUTS</b>
          <div class="shortcut-row">
            <span>Quick Save Tab</span>
            <kbd>Alt + Shift + H</kbd>
          </div>
          <div class="shortcut-row">
            <span>Open Hoard Web App</span>
            <kbd>Alt + Shift + O</kbd>
          </div>
        </div>

        <div class="info-box">
          <b>RIGHT-CLICK CONTEXT MENU</b>
          <p style="margin: 4px 0 0; font-size: 10px; opacity: .8;">Right-click any link or selection to save directly into HOARD.</p>
        </div>

        <button id="openWebAppBtn" class="btn-secondary">
          OPEN HOARD WEB APP ↗
        </button>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
