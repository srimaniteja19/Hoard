name = "hoard-email-ingest"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# Enable Email Routing event handling
[triggers]
crons = []

# Environment variables (override in dashboard or .dev.vars for secrets)
[vars]
INGEST_URL = "https://hoard.yourdomain.com/api/ingest"
# Set your INGEST_SECRET via: npx wrangler secret put INGEST_SECRET
